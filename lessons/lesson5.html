<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speako — Lesson 5: Directions and Transportation</title>
  <!-- Google Fonts: Montserrat (headings), Inter (body), Noto Sans Thai (Thai script) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #0B2A5B;
      --teal: #14A3A0;
      --teal-light: #E6F6F5;
      --off-white: #F7F5F2;
      --card-bg: #FFFFFF;
      --dark-gray: #2B2F36;
      --muted-gray: #5E6470;
      --coral: #F47C6B;
      --coral-light: #FFF0ED;
      --gradient-brand: linear-gradient(135deg, #14A3A0 0%, #F47C6B 100%);
      --gradient-soft: linear-gradient(135deg, rgba(20, 163, 160, 0.12) 0%, rgba(244, 124, 107, 0.12) 100%);
      --shadow-card: 0 10px 28px rgba(11, 42, 91, 0.07), 0 2px 6px rgba(11, 42, 91, 0.04);
      --shadow-hover: 0 14px 34px rgba(11, 42, 91, 0.12), 0 4px 10px rgba(11, 42, 91, 0.06);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --stage-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1A2230;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--dark-gray);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Outer viewport wrapper that centers and scales the 16:9 slide deck */
    .viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Fixed 16:9 virtual stage (1600 x 900) scaled dynamically to fit window */
    .deck-stage {
      width: 1600px;
      height: 900px;
      background-color: var(--off-white);
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      transform: scale(var(--stage-scale));
      transform-origin: center center;
      display: flex;
      flex-direction: column;
    }

    :fullscreen .deck-stage,
    :-webkit-full-screen .deck-stage {
      border-radius: 0;
    }

    /* Subtle decorative background blobs */
    .bg-decor {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }
    .bg-decor-1 {
      width: 420px;
      height: 420px;
      background: rgba(20, 163, 160, 0.16);
      top: -140px;
      right: -100px;
    }
    .bg-decor-2 {
      width: 380px;
      height: 380px;
      background: rgba(244, 124, 107, 0.15);
      bottom: -140px;
      left: -100px;
    }

    /* Top Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(11, 42, 91, 0.08);
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gradient-brand);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 0 4px 4px 0;
    }

    /* Top Header Bar (Speako wordmark + Slide badge + Status pills) */
    .slide-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 52px 10px;
      position: relative;
      z-index: 15;
      flex-shrink: 0;
    }

    .brand-wordmark {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .brand-wordmark .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      display: inline-block;
    }
    .brand-wordmark .lesson-tag {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--teal);
      background: var(--teal-light);
      padding: 4px 12px;
      border-radius: 999px;
      margin-left: 8px;
      letter-spacing: 0;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-toggle {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid rgba(11, 42, 91, 0.14);
      background: rgba(255, 255, 255, 0.85);
      color: var(--navy);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .pill-toggle:hover {
      border-color: var(--teal);
      background: #FFFFFF;
    }
    .pill-toggle.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }
    .pill-toggle kbd {
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(11, 42, 91, 0.09);
      color: inherit;
    }
    .pill-toggle.active kbd {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Main Slide Content Area with Smooth Fade Transition */
    .slide-viewport {
      flex: 1;
      position: relative;
      z-index: 10;
      padding: 10px 56px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .slide-viewport.fading {
      opacity: 0;
      transform: translateY(6px);
    }

    /* Slide Header */
    .slide-header {
      margin-bottom: 18px;
      flex-shrink: 0;
    }
    .slide-eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--teal);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slide-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.35rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.18;
      letter-spacing: -0.02em;
    }
    .slide-subtitle {
      font-size: 1.18rem;
      color: var(--muted-gray);
      margin-top: 5px;
      font-weight: 500;
    }

    /* Thai Typography & Romanization Toggle */
    .thai {
      font-family: 'Noto Sans Thai', sans-serif;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.35;
      letter-spacing: 0.01em;
    }
    .romanization {
      color: var(--teal);
      font-weight: 600;
      line-height: 1.3;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }
    body.hide-romanization .romanization {
      opacity: 0;
      pointer-events: none;
    }
    .meaning {
      color: var(--dark-gray);
      font-weight: 500;
      line-height: 1.35;
    }

    /* Coral highlight inside patterns */
    .coral-hl {
      color: var(--coral);
      background: var(--coral-light);
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: 700;
      display: inline-block;
    }

    /* Listen Button (Web Speech API) */
    .listen-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--coral-light);
      color: var(--coral);
      border: 1.5px solid rgba(244, 124, 107, 0.35);
      padding: 7px 14px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      flex-shrink: 0;
    }
    .listen-btn:hover {
      background: var(--coral);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(244, 124, 107, 0.35);
    }
    .listen-btn:active {
      transform: translateY(0);
    }
    .listen-btn.speaking {
      background: var(--coral);
      color: #FFFFFF;
      animation: pulse-coral 1s infinite;
    }
    @keyframes pulse-coral {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 124, 107, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(244, 124, 107, 0); }
    }
    /* Hide Listen buttons automatically if no Thai voice is available */
    body.no-thai-voice .listen-btn {
      display: none !important;
    }

    /* Hero / Title & Goal / Closing Slides */
    .hero-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 54px 68px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(20, 163, 160, 0.12);
    }
    .hero-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: var(--gradient-brand);
    }
    .hero-emoji-row {
      font-size: 3.7rem;
      margin-bottom: 22px;
      display: flex;
      gap: 20px;
      background: var(--gradient-soft);
      padding: 16px 34px;
      border-radius: 999px;
    }
    .hero-badge {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--teal);
      background: var(--teal-light);
      padding: 8px 20px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--navy);
      line-height: 1.15;
      max-width: 1120px;
      margin-bottom: 18px;
    }
    .hero-subtitle {
      font-size: 1.5rem;
      color: var(--dark-gray);
      max-width: 860px;
      line-height: 1.5;
      font-weight: 500;
    }
    .hero-sample-box {
      margin-top: 28px;
      background: var(--off-white);
      border-radius: var(--radius-md);
      padding: 20px 36px;
      display: inline-flex;
      align-items: center;
      gap: 24px;
      border: 1.5px solid rgba(11, 42, 91, 0.08);
    }

    /* Key Phrase Spotlight Slide (1 slide per key phrase) */
    .keyphrase-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 26px;
      align-items: stretch;
    }
    .keyphrase-main-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 42px 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      border-top: 8px solid var(--teal);
    }
    .keyphrase-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .keyphrase-emoji {
      font-size: 3.6rem;
      background: var(--gradient-soft);
      width: 86px;
      height: 86px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .keyphrase-main-card .thai {
      font-size: 3.7rem;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .keyphrase-main-card .romanization {
      font-size: 1.85rem;
      margin-bottom: 12px;
    }
    .keyphrase-main-card .meaning {
      font-size: 1.55rem;
      color: var(--dark-gray);
      font-weight: 600;
    }
    .keyphrase-example-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 8px solid var(--coral);
    }
    .keyphrase-ex-badge {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--coral);
      background: var(--coral-light);
      padding: 6px 14px;
      border-radius: 999px;
      align-self: flex-start;
    }
    .keyphrase-ex-box {
      background: var(--off-white);
      border-radius: var(--radius-md);
      padding: 24px 26px;
      border: 1.5px solid rgba(11, 42, 91, 0.08);
      margin: 16px 0;
    }
    .keyphrase-ex-box .thai {
      font-size: 2.3rem;
      margin-bottom: 6px;
    }
    .keyphrase-ex-box .romanization {
      font-size: 1.28rem;
      margin-bottom: 6px;
    }
    .keyphrase-ex-box .meaning {
      font-size: 1.15rem;
    }
    .keyphrase-tip {
      font-size: 1.08rem;
      color: var(--muted-gray);
      line-height: 1.5;
      background: var(--teal-light);
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      color: var(--navy);
      font-weight: 500;
    }

    /* Vocabulary Card Grids */
    .vocab-grid {
      flex: 1;
      display: grid;
      gap: 18px;
      align-content: stretch;
    }
    .vocab-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }
    .vocab-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .vocab-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .vocab-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid rgba(11, 42, 91, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .vocab-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(20, 163, 160, 0.3);
    }
    .vocab-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .vocab-emoji {
      font-size: 2.4rem;
      line-height: 1;
      background: var(--gradient-soft);
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .vocab-body {
      margin-top: 10px;
    }
    .vocab-card .thai {
      font-size: 2.5rem;
      margin-bottom: 4px;
    }
    .vocab-grid.cols-3 .vocab-card .thai {
      font-size: 2.7rem;
    }
    .vocab-card .romanization {
      font-size: 1.22rem;
      margin-bottom: 4px;
    }
    .vocab-card .meaning {
      font-size: 1.12rem;
      color: var(--dark-gray);
    }

    /* Reveal Practice Cards (Review, Drills) */
    .reveal-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
      gap: 10px;
    }
    .secondary-btn {
      background: #FFFFFF;
      color: var(--navy);
      border: 1.5px solid rgba(11, 42, 91, 0.18);
      padding: 7px 16px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .secondary-btn:hover {
      border-color: var(--coral);
      color: var(--coral);
    }

    .reveal-grid {
      flex: 1;
      display: grid;
      gap: 16px;
      align-content: stretch;
    }
    .reveal-grid.cols-4 {
      grid-template-columns: repeat(4, 1fr);
    }
    .reveal-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .reveal-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .reveal-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      border: 2px solid rgba(20, 163, 160, 0.18);
      transition: all 0.22s ease;
      position: relative;
    }
    .reveal-card:hover {
      border-color: var(--coral);
      transform: translateY(-2px);
    }
    .reveal-card.revealed {
      border-color: var(--teal);
      background: #FFFFFF;
    }
    .reveal-prompt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .reveal-prompt-tag {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--teal);
      background: var(--teal-light);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .reveal-prompt {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--navy);
      margin-top: 8px;
      line-height: 1.25;
    }
    .reveal-grid.cols-3 .reveal-prompt,
    .reveal-grid.cols-4 .reveal-prompt {
      font-size: 1.32rem;
    }
    .reveal-answer-area {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1.5px dashed rgba(11, 42, 91, 0.12);
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .reveal-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--coral-light);
      color: var(--coral);
      font-weight: 700;
      font-size: 1.02rem;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1.5px dashed rgba(244, 124, 107, 0.5);
    }
    .reveal-content {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .reveal-card.revealed .reveal-placeholder {
      display: none;
    }
    .reveal-card.revealed .reveal-content {
      display: flex;
    }
    .reveal-card .thai {
      font-size: 2.25rem;
    }
    .reveal-grid.cols-3 .reveal-card .thai,
    .reveal-grid.cols-4 .reveal-card .thai {
      font-size: 2.05rem;
    }
    .reveal-card .romanization {
      font-size: 1.16rem;
      margin-top: 2px;
    }

    /* Pattern & Grammar Slides */
    .pattern-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: stretch;
    }
    .pattern-box {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 6px solid var(--teal);
    }
    .pattern-box.coral-top {
      border-top-color: var(--coral);
    }
    .pattern-formula {
      background: var(--off-white);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      border: 1.5px solid rgba(11, 42, 91, 0.08);
    }
    .pattern-formula .thai {
      font-size: 2.2rem;
    }
    .pattern-formula .romanization {
      font-size: 1.18rem;
      margin-top: 4px;
    }
    .pattern-formula .meaning {
      font-size: 1.06rem;
      margin-top: 2px;
    }
    .example-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
      justify-content: center;
    }
    .example-row {
      background: #FFFFFF;
      border: 1.5px solid rgba(11, 42, 91, 0.08);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .example-row .thai {
      font-size: 1.85rem;
    }
    .example-row .romanization {
      font-size: 1.08rem;
    }
    .example-row .meaning {
      font-size: 1rem;
      color: var(--muted-gray);
    }

    /* Callout Banner (Memory Note / Politeness Reminder) */
    .note-banner {
      background: var(--gradient-soft);
      border-left: 6px solid var(--coral);
      border-radius: var(--radius-sm);
      padding: 13px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      flex-shrink: 0;
    }
    .note-banner-text {
      font-size: 1.08rem;
      color: var(--navy);
      font-weight: 600;
      line-height: 1.4;
    }
    .note-banner-text strong {
      color: var(--coral);
    }

    /* Role-Play Dialogue Slides */
    .dialogue-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }
    .dialogue-line {
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 13px 22px;
      box-shadow: 0 4px 14px rgba(11, 42, 91, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-left: 7px solid var(--navy);
      transition: all 0.2s ease;
    }

    /**
     * Checks whether a Thai ("th" / "th-TH") speechSynthesis voice is available.
     * Hides all Listen buttons automatically if no Thai voice exists.
     */
    function detectThaiVoice() {
      if (!("speechSynthesis" in window)) {
        document.body.classList.add("no-thai-voice");
        hasThaiVoice = false;
        return;
      }

      const voices = window.speechSynthesis.getVoices() || [];
      const found = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("th"));

      if (found) {
        thaiVoice = found;
        hasThaiVoice = true;
        document.body.classList.remove("no-thai-voice");
      } else if (voices.length > 0) {
        thaiVoice = null;
        hasThaiVoice = false;
        document.body.classList.add("no-thai-voice");
      }
    }

    if ("speechSynthesis" in window) {
      detectThaiVoice();
      window.speechSynthesis.onvoiceschanged = detectThaiVoice;
      setTimeout(() => {
        const voices = window.speechSynthesis.getVoices() || [];
        const found = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("th"));
        if (!found) {
          document.body.classList.add("no-thai-voice");
        } else {
          thaiVoice = found;
          hasThaiVoice = true;
          document.body.classList.remove("no-thai-voice");
        }
      }, 900);
    } else {
      document.body.classList.add("no-thai-voice");
    }

    /**
     * Speaks a Thai word or phrase using Web Speech API (lang "th-TH").
     */
    function speakThai(rawText, btnElement) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const cleaned = rawText
        .replace(/ครับ\/ค่ะ/g, "ครับ")
        .replace(/ครับ\/คะ/g, "ครับ")
        .replace(/ผม\/ฉัน/g, "ฉัน")
        .replace(/\.\.\./g, " ")
        .replace(/·/g, " ")
        .trim();

      const utterance = new SpeechSynthesisUtterance(cleaned);
      utterance.lang = "th-TH";
      utterance.rate = 0.88;
      if (thaiVoice) {
        utterance.voice = thaiVoice;
      }

      document.querySelectorAll(".listen-btn.speaking").forEach(b => b.classList.remove("speaking"));
      if (btnElement) {
        btnElement.classList.add("speaking");
        utterance.onend = () => btnElement.classList.remove("speaking");
        utterance.onerror = () => btnElement.classList.remove("speaking");
      }

      window.speechSynthesis.speak(utterance);
    }

        const progressPercent = ((currentSlideIndex + 1) / SLIDES.length) * 100;
        progressFill.style.width = `${progressPercent}%`;
        slideCounter.textContent = `${currentSlideIndex + 1} / ${SLIDES.length}`;

        prevBtn.disabled = currentSlideIndex === 0;
        nextBtn.disabled = currentSlideIndex === SLIDES.length - 1;

        teacherNotesBody.textContent = slide.notes || "No speaker notes for this slide.";
      };

      if (withFade) {
        slideViewport.classList.add("fading");
        setTimeout(() => {
          updateDOM();
          slideViewport.classList.remove("fading");
        }, 160);
      } else {
        updateDOM();
      }
    }

    function attachSlideInteractions() {
      // Listen buttons
      slideViewport.querySelectorAll(".listen-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const phrase = btn.getAttribute("data-speak");
          if (phrase) speakThai(phrase, btn);
        });
      });

      // Reveal cards
      slideViewport.querySelectorAll(".reveal-card").forEach(card => {
        card.addEventListener("click", () => {
          card.classList.toggle("revealed");
        });
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            e.stopPropagation();
            card.classList.toggle("revealed");
          }
        });
      });

      const revealAllBtn = document.getElementById("revealAllBtn");
      const hideAllBtn = document.getElementById("hideAllBtn");
      if (revealAllBtn) {
        revealAllBtn.addEventListener("click", () => {
          slideViewport.querySelectorAll(".reveal-card").forEach(c => c.classList.add("revealed"));
        });
      }
      if (hideAllBtn) {
        hideAllBtn.addEventListener("click", () => {
          slideViewport.querySelectorAll(".reveal-card").forEach(c => c.classList.remove("revealed"));
        });
      }

      // Role-play line-by-line stepping
      const stepRoleplayBtn = document.getElementById("stepRoleplayBtn");
      const showAllRoleplayBtn = document.getElementById("showAllRoleplayBtn");
      if (stepRoleplayBtn) {
        stepRoleplayBtn.addEventListener("click", () => {
          const lines = slideViewport.querySelectorAll(".dialogue-line");
          if (roleplayStepCount === null || roleplayStepCount >= lines.length) {
            roleplayStepCount = 1;
          } else {
            roleplayStepCount += 1;
          }
          lines.forEach((lineEl, idx) => {
            lineEl.classList.toggle("hidden-step", idx >= roleplayStepCount);
          });
          stepRoleplayBtn.textContent =
            roleplayStepCount < lines.length
              ? `Next Line (${roleplayStepCount}/${lines.length})`
              : "Restart Step-by-Step";
        });
      }
      if (showAllRoleplayBtn) {
        showAllRoleplayBtn.addEventListener("click", () => {
          roleplayStepCount = null;
          slideViewport.querySelectorAll(".dialogue-line").forEach(lineEl => {
            lineEl.classList.remove("hidden-step");
          });
          if (stepRoleplayBtn) stepRoleplayBtn.textContent = "Step Line-by-Line";
        });
      }
    }

    /* ==========================================================================
       4. NAVIGATION, KEYBOARD SHORTCUTS, TOUCH SWIPE & 16:9 SCALING
       ========================================================================== */
    function goToSlide(index) {
      if (index < 0 || index >= SLIDES.length || index === currentSlideIndex) return;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      currentSlideIndex = index;
      renderCurrentSlide(true);
    }

    function nextSlide() {
      goToSlide(currentSlideIndex + 1);
    }

    function prevSlide() {
      goToSlide(currentSlideIndex - 1);
    }

    function toggleRomanization() {
      romanizationVisible = !romanizationVisible;
      document.body.classList.toggle("hide-romanization", !romanizationVisible);
      document.getElementById("romStateText").textContent = romanizationVisible ? "ON" : "OFF";
      document.getElementById("toggleRomBtn").classList.toggle("active", !romanizationVisible);
    }

    function toggleTeacherNotes() {
      notesVisible = !notesVisible;
      document.body.classList.toggle("show-notes", notesVisible);
      document.getElementById("toggleNotesBtn").classList.toggle("active", notesVisible);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    prevBtn.addEventListener("click", prevSlide);
    nextBtn.addEventListener("click", nextSlide);
    document.getElementById("toggleRomBtn").addEventListener("click", toggleRomanization);
    document.getElementById("toggleNotesBtn").addEventListener("click", toggleTeacherNotes);
    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);

    window.addEventListener("keydown", e => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;

      const key = e.key;
      if (key === "ArrowRight" || key === "PageDown") {
        e.preventDefault();
        nextSlide();
      } else if (key === "ArrowLeft" || key === "PageUp") {
        e.preventDefault();
        prevSlide();
      } else if (key === " ") {
        if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
        e.preventDefault();
        nextSlide();
      } else if (key === "t" || key === "T") {
        e.preventDefault();
        toggleRomanization();
      } else if (key === "n" || key === "N") {
        e.preventDefault();
        toggleTeacherNotes();
      } else if (key === "f" || key === "F") {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener("touchstart", e => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }, { passive: true });

    window.addEventListener("touchend", e => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) nextSlide();
          else prevSlide();
        }
      }
    }, { passive: true });

    function updateStageScale() {
      const stageWidth = 1600;
      const stageHeight = 900;
      const scaleX = window.innerWidth / stageWidth;
      const scaleY = window.innerHeight / stageHeight;
      const scale = Math.min(scaleX, scaleY);
      document.documentElement.style.setProperty("--stage-scale", scale.toFixed(4));
    }

    window.addEventListener("resize", updateStageScale);
    updateStageScale();
    renderCurrentSlide(false);
  </script>
</body>
</html>
