<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speako — Lesson 8: Review and Role Play</title>
  <!-- Google Fonts: Montserrat (headings), Inter (body), Noto Sans Thai (Thai script) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #0B2A5B;
      --teal: #14A3A0;
      --teal-light: #E6F6F5;
      --off-white: #F7F5F2;
      --card-bg: #FFFFFF;
      --dark-gray: #2B2F36;
      --muted-gray: #5E6470;
      --coral: #F47C6B;
      --coral-light: #FFF0ED;
      --gradient-brand: linear-gradient(135deg, #14A3A0 0%, #F47C6B 100%);
      --gradient-soft: linear-gradient(135deg, rgba(20, 163, 160, 0.12) 0%, rgba(244, 124, 107, 0.12) 100%);
      --shadow-card: 0 10px 28px rgba(11, 42, 91, 0.07), 0 2px 6px rgba(11, 42, 91, 0.04);
      --shadow-hover: 0 14px 34px rgba(11, 42, 91, 0.12), 0 4px 10px rgba(11, 42, 91, 0.06);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --stage-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1A2230;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--dark-gray);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Outer viewport wrapper that centers and scales the 16:9 slide deck */
    .viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Fixed 16:9 virtual stage (1600 x 900) scaled dynamically to fit window */
    .deck-stage {
      width: 1600px;
      height: 900px;
      background-color: var(--off-white);
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      transform: scale(var(--stage-scale));
      transform-origin: center center;
      display: flex;
      flex-direction: column;
    }

    :fullscreen .deck-stage,
    :-webkit-full-screen .deck-stage {
      border-radius: 0;
    }

    /* Subtle decorative background blobs */
    .bg-decor {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }
    .bg-decor-1 {
      width: 420px;
      height: 420px;
      background: rgba(20, 163, 160, 0.16);
      top: -140px;
      right: -100px;
    }
    .bg-decor-2 {
      width: 380px;
      height: 380px;
      background: rgba(244, 124, 107, 0.15);
      bottom: -140px;
      left: -100px;
    }

    /* Top Progress Bar */
    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(11, 42, 91, 0.08);
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gradient-brand);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 0 4px 4px 0;
    }

    /* Top Header Bar (Speako wordmark + Slide badge + Status pills) */
    .slide-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 52px 10px;
      position: relative;
      z-index: 15;
      flex-shrink: 0;
    }

    .brand-wordmark {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      color: var(--navy);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .brand-wordmark .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--coral);
      display: inline-block;
    }
    .brand-wordmark .lesson-tag {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--teal);
      background: var(--teal-light);
      padding: 4px 12px;
      border-radius: 999px;
      margin-left: 8px;
      letter-spacing: 0;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-toggle {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid rgba(11, 42, 91, 0.14);
      background: rgba(255, 255, 255, 0.85);
      color: var(--navy);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .pill-toggle:hover {
      border-color: var(--teal);
      background: #FFFFFF;
    }
    .pill-toggle.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }
    .pill-toggle kbd {
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(11, 42, 91, 0.09);
      color: inherit;
    }
    .pill-toggle.active kbd {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Main Slide Content Area with Smooth Fade Transition */
    .slide-viewport {
      flex: 1;
      position: relative;
      z-index: 10;
      padding: 10px 56px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .slide-viewport.fading {
      opacity: 0;
      transform: translateY(6px);
    }

    /* Slide Header */
    .slide-header {
      margin-bottom: 18px;
      flex-shrink: 0;
    }
    .slide-eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--teal);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slide-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.35rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.18;
      letter-spacing: -0.02em;
    }
    .slide-subtitle {
      font-size: 1.18rem;
      color: var(--muted-gray);
      margin-top: 5px;
      font-weight: 500;
    }

    /* Thai Typography & Romanization Toggle */
    .thai {
      font-family: 'Noto Sans Thai', sans-serif;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.35;
      letter-spacing: 0.01em;
    }
    .romanization {
      color: var(--teal);
      font-weight: 600;
      line-height: 1.3;
      transition: opacity 0.2s ease, filter 0.2s ease;
    }
    body.hide-romanization .romanization {
      opacity: 0;
      pointer-events: none;
    }
    .meaning {
      color: var(--dark-gray);
      font-weight: 500;
      line-height: 1.35;
    }

    /* Listen Button (Web Speech API) */
    .listen-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--coral-light);
      color: var(--coral);
      border: 1.5px solid rgba(244, 124, 107, 0.35);
      padding: 7px 14px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      flex-shrink: 0;
    }
    .listen-btn:hover {
      background: var(--coral);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(244, 124, 107, 0.35);
    }
    .listen-btn:active {
      transform: translateY(0);
    }
    .listen-btn.speaking {
      background: var(--coral);
      color: #FFFFFF;
      animation: pulse-coral 1s infinite;
    }
    @keyframes pulse-coral {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 124, 107, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(244, 124, 107, 0); }
    }
    /* Hide Listen buttons automatically if no Thai voice is available */
    body.no-thai-voice .listen-btn {
      display: none !important;
    }

    /* Hero / Title & Goal / Closing Slides */
    .hero-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 54px 68px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(20, 163, 160, 0.12);
    }
    .hero-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: var(--gradient-brand);
    }
    .hero-emoji-row {
      font-size: 3.7rem;
      margin-bottom: 22px;
      display: flex;
      gap: 20px;
      background: var(--gradient-soft);
      padding: 16px 34px;
      border-radius: 999px;
    }
    .hero-badge {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--teal);
      background: var(--teal-light);
      padding: 8px 20px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 3.5rem;
      color: var(--navy);
      line-height: 1.15;
      max-width: 1120px;
      margin-bottom: 18px;
    }
    .hero-subtitle {
      font-size: 1.5rem;
      color: var(--dark-gray);
      max-width: 860px;
      line-height: 1.5;
      font-weight: 500;
    }
    .hero-sample-box {
      margin-top: 28px;
      background: var(--off-white);
      border-radius: var(--radius-md);
      padding: 20px 36px;
      display: inline-flex;
      align-items: center;
      gap: 24px;
      border: 1.5px solid rgba(11, 42, 91, 0.08);
    }

    /* Vocabulary / Step Cards */
    .vocab-grid {
      flex: 1;
      display: grid;
      gap: 18px;
      align-content: stretch;
    }
    .vocab-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .vocab-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }
    .vocab-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid rgba(11, 42, 91, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .vocab-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .vocab-emoji {
      font-size: 2.5rem;
      line-height: 1;
      background: var(--gradient-soft);
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Reveal Practice Cards (L1–L7 Review Grids) */
    .reveal-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
      gap: 10px;
    }
    .secondary-btn {
      background: #FFFFFF;
      color: var(--navy);
      border: 1.5px solid rgba(11, 42, 91, 0.18);
      padding: 7px 16px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .secondary-btn:hover {
      border-color: var(--coral);
      color: var(--coral);
    }

    .reveal-grid {
      flex: 1;
      display: grid;
      gap: 16px;
      align-content: stretch;
    }
    .reveal-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .reveal-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .reveal-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      border: 2px solid rgba(20, 163, 160, 0.18);
      transition: all 0.22s ease;
      position: relative;
    }
    .reveal-card:hover {
      border-color: var(--coral);
      transform: translateY(-2px);
    }
    .reveal-card.revealed {
      border-color: var(--teal);
      background: #FFFFFF;
    }
    .reveal-prompt-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .reveal-prompt-tag {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--teal);
      background: var(--teal-light);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .reveal-prompt {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.38rem;
      font-weight: 700;
      color: var(--navy);
      margin-top: 8px;
      line-height: 1.25;
    }
    .reveal-answer-area {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1.5px dashed rgba(11, 42, 91, 0.12);
      min-height: 102px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .reveal-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--coral-light);
      color: var(--coral);
      font-weight: 700;
      font-size: 1rem;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1.5px dashed rgba(244, 124, 107, 0.5);
    }
    .reveal-content {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .reveal-card.revealed .reveal-placeholder {
      display: none;
    }
    .reveal-card.revealed .reveal-content {
      display: flex;
    }
    .reveal-card .thai {
      font-size: 2.05rem;
    }
    .reveal-card .romanization {
      font-size: 1.12rem;
      margin-top: 2px;
    }

    /* Quick-Fire Random Flashcard Game Slide */
    .quickfire-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .quickfire-card {
      width: 100%;
      max-width: 1020px;
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 40px 54px;
      border-top: 8px solid var(--teal);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .quickfire-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .quickfire-lesson-pill {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--teal);
      background: var(--teal-light);
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .quickfire-prompt {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 2.6rem;
      color: var(--navy);
      margin-bottom: 24px;
    }
    .quickfire-answer-box {
      width: 100%;
      min-height: 155px;
      border-radius: var(--radius-md);
      background: var(--off-white);
      border: 2px dashed rgba(20, 163, 160, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 32px;
    }
    .quickfire-card.revealed .quickfire-answer-box {
      border-style: solid;
      border-color: var(--teal);
      background: #F4FBFB;
    }
    .quickfire-btn {
      background: var(--coral);
      color: #FFFFFF;
      border: none;
      padding: 16px 38px;
      border-radius: 999px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(244, 124, 107, 0.35);
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .quickfire-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(244, 124, 107, 0.45);
    }

    /* Callout Banner (Politeness Reminder) */
    .note-banner {
      background: var(--gradient-soft);
      border-left: 6px solid var(--coral);
      border-radius: var(--radius-sm);
      padding: 13px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      flex-shrink: 0;
    }
    .note-banner-text {
      font-size: 1.08rem;
      color: var(--navy);
      font-weight: 600;
      line-height: 1.4;
    }
    .note-banner-text strong {
      color: var(--coral);
    }

    /* Role-Play Dialogue Slides */
    .dialogue-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }
    .dialogue-line {
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 13px 22px;
      box-shadow: 0 4px 14px rgba(11, 42, 91, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-left: 7px solid var(--navy);
      transition: all 0.2s ease;
    }
    .dialogue-line.speaker-a {
      border-left-color: var(--navy);
    }
    .dialogue-line.speaker-b {
      border-left-color: var(--teal);
      background: #F4FBFB;
    }
    .dialogue-line.hidden-step {
      opacity: 0.22;
      filter: blur(4px);
      pointer-events: none;
    }
    .dialogue-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }
    .speaker-badge {
      min-width: 110px;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      color: #FFFFFF;
      background: var(--navy);
      flex-shrink: 0;
    }
    .speaker-b .speaker-badge {
      background: var(--teal);
    }
    .dialogue-text-group {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 18px;
      row-gap: 2px;
    }
    .dialogue-line .thai {
      font-size: 1.9rem;
      color: var(--navy);
    }
    .dialogue-line.speaker-b .thai {
      color: #0D7A78;
    }
    .dialogue-line .romanization {
      font-size: 1.1rem;
    }
    .dialogue-line .meaning {
      font-size: 1.04rem;
      color: var(--muted-gray);
    }

    /* Interactive Checklist Slides (Your Turn 5-Step & "I can..." 10-Item) */
    .checklist-grid-5 {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }
    .checklist-grid-10 {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 20px;
      align-content: center;
    }
    .check-item {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 15px 22px;
      box-shadow: var(--shadow-card);
      border: 2px solid rgba(11, 42, 91, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .check-item:hover {
      border-color: var(--teal);
      transform: translateY(-1px);
    }
    .check-item.checked {
      background: #F2FBF9;
      border-color: var(--teal);
    }
    .check-box-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid rgba(11, 42, 91, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: transparent;
      background: #FFFFFF;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }
    .check-item.checked .check-box-circle {
      background: var(--teal);
      border-color: var(--teal);
      color: #FFFFFF;
    }

    /* Certificate Slide */
    .certificate-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .certificate-card {
      width: 100%;
      max-width: 1120px;
      background: #FFFFFF;
      border-radius: 26px;
      padding: 44px 64px;
      box-shadow: 0 20px 55px rgba(11, 42, 91, 0.12);
      border: 3px solid var(--teal);
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* ==========================================================================
       2. STATE, QUICK-FIRE POOL & WEB SPEECH API (THAI TTS) INITIALIZATION
       ========================================================================== */
    let currentSlideIndex = 0;
    let romanizationVisible = true;
    let notesVisible = false;
    let thaiVoice = null;
    let hasThaiVoice = false;
    let roleplayStepCount = null;

    // Persistent state for interactive checklists, quick-fire game, and certificate name
    const yourTurnChecked = new Set();
    const iCanChecked = new Set();
    let customStudentName = STUDENT_NAME;

    // Build the Quick-Fire flashcard pool automatically from the L1–L7 review slides (42 items)
    const QUICKFIRE_POOL = [];
    SLIDES.filter(s => s.type === "reveal" && Array.isArray(s.items)).forEach(s => {
      s.items.forEach(item => {
        QUICKFIRE_POOL.push({
          lessonTag: item.tag,
          prompt: item.prompt,
          thai: item.thai,
          romanization: item.romanization,
          meaning: item.meaning,
          speakText: item.speakText || item.thai
        });
      });
    });

    let quickfireIndex = 0;
    let quickfireRevealed = false;
    let quickfireCount = 1;

    function detectThaiVoice() {
      if (!("speechSynthesis" in window)) {
        document.body.classList.add("no-thai-voice");
        hasThaiVoice = false;
        return;
      }

      const voices = window.speechSynthesis.getVoices() || [];
      const found = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("th"));

      if (found) {
        thaiVoice = found;
        hasThaiVoice = true;
        document.body.classList.remove("no-thai-voice");
      } else if (voices.length > 0) {
        thaiVoice = null;
        hasThaiVoice = false;
        document.body.classList.add("no-thai-voice");
      }
    }

    if ("speechSynthesis" in window) {
      detectThaiVoice();
      window.speechSynthesis.onvoiceschanged = detectThaiVoice;
      setTimeout(() => {
        const voices = window.speechSynthesis.getVoices() || [];
        const found = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("th"));
        if (!found) {
          document.body.classList.add("no-thai-voice");
        } else {
          thaiVoice = found;
          hasThaiVoice = true;
          document.body.classList.remove("no-thai-voice");
        }
      }, 900);
    } else {
      document.body.classList.add("no-thai-voice");
    }

    function speakThai(rawText, btnElement) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const cleaned = rawText
        .replace(/ครับ\/ค่ะ/g, "ครับ")
        .replace(/ครับ\/คะ/g, "ครับ")
        .replace(/ผม\/ฉัน/g, "ฉัน")
        .replace(/\.\.\./g, " ")
        .replace(/·/g, " ")
        .trim();

      const utterance = new SpeechSynthesisUtterance(cleaned);
      utterance.lang = "th-TH";
      utterance.rate = 0.88;
      if (thaiVoice) {
        utterance.voice = thaiVoice;
      }

      document.querySelectorAll(".listen-btn.speaking").forEach(b => b.classList.remove("speaking"));
      if (btnElement) {
        btnElement.classList.add("speaking");
        utterance.onend = () => btnElement.classList.remove("speaking");
        utterance.onerror = () => btnElement.classList.remove("speaking");
      }

      window.speechSynthesis.speak(utterance);
    }

    function renderListenButton(textToSpeak) {
      const escaped = String(textToSpeak || "").replace(/"/g, "&quot;");
      return `<button type="button" class="listen-btn" data-speak="${escaped}" aria-label="Listen to ${escaped}">🔊 Listen</button>`;
    }

    /* ==========================================================================
       3. SLIDE RENDERING ENGINE
       ========================================================================== */
    const slideViewport = document.getElementById("slideViewport");
    const progressFill = document.getElementById("progressFill");
    const slideCounter = document.getElementById("slideCounter");
    const teacherNotesBody = document.getElementById("teacherNotesBody");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function buildSlideHTML(slide) {
      // 1. HERO SLIDE (Title, Goal, Closing)
      if (slide.type === "hero") {
        const emojisHtml = (slide.emojis || []).map(e => `<span>${e}</span>`).join("");
        const sampleHtml = slide.sample
          ? `<div class="hero-sample-box">
               <div style="text-align:left;">
                 <div class="thai" style="font-size:2.4rem;">${slide.sample.thai}</div>
                 <div class="romanization" style="font-size:1.25rem;">${slide.sample.romanization}</div>
                 <div class="meaning" style="font-size:1.1rem;">${slide.sample.meaning}</div>
               </div>
               ${renderListenButton(slide.sample.speakText || slide.sample.thai)}
             </div>`
          : "";

        return `
          <div class="hero-card">
            <div class="hero-badge">${slide.badge}</div>
            <div class="hero-emoji-row">${emojisHtml}</div>
            <h1 class="hero-title">${slide.title}</h1>
            <p class="hero-subtitle">${slide.subtitle}</p>
            ${sampleHtml}
          </div>
        `;
      }

      // 2. REVEAL INTERACTIVE SLIDE (L1–L7 Review Grids)
      if (slide.type === "reveal") {
        const colsClass = `cols-${slide.columns || 3}`;
        const cardsHtml = slide.items
          .map((item, idx) => {
            const speakTarget = item.speakText || item.thai;
            return `
              <div class="reveal-card" data-reveal-card="${idx}" tabindex="0" role="button" aria-label="Reveal Thai for ${item.prompt}">
                <div>
                  <div class="reveal-prompt-row">
                    <span class="reveal-prompt-tag">${item.tag}</span>
                    <span style="font-size:0.82rem; color:var(--muted-gray); font-weight:600;">Click to reveal</span>
                  </div>
                  <div class="reveal-prompt">${item.prompt}</div>
                </div>

                <div class="reveal-answer-area">
                  <div class="reveal-placeholder">👆 Click to Reveal Thai Answer</div>
                  <div class="reveal-content">
                    <div>
                      <div class="thai">${item.thai}</div>
                      <div class="romanization">${item.romanization}</div>
                      <div class="meaning" style="font-size:0.95rem; color:var(--muted-gray);">${item.meaning}</div>
                    </div>
                    ${renderListenButton(speakTarget)}
                  </div>
                </div>
              </div>
            `;
          })
          .join("");

        return `
          <div class="slide-header" style="display:flex; justify-content:space-between; align-items:flex-end;">
            <div>
              <div class="slide-eyebrow">${slide.eyebrow}</div>

      }

      // 3. QUICK-FIRE RANDOM FLASHCARD GAME SLIDE
      if (slide.type === "quickfire") {
        const currentCard = QUICKFIRE_POOL[quickfireIndex] || QUICKFIRE_POOL[0];
        return `
          <div class="slide-header" style="display:flex; justify-content:space-between; align-items:flex-end;">

      // 4. ROLE-PLAY DIALOGUE SLIDE (5 Scenes of "A Full Day in Thailand")
      if (slide.type === "roleplay") {

            return `

      // 5. "YOUR TURN: ROLE-PLAY A FULL DAY IN THAILAND" (5-step clickable checklist)
      if (slide.type === "yourturn_checklist") {
        const rowsHtml = slide.steps
          .map((step, idx) => {
            const isChecked = yourTurnChecked.has(idx);
            return `
              <div class="check-item ${isChecked ? "checked" : ""}" data-yourturn-idx="${idx}" tabindex="0" role="button" aria-pressed="${isChecked}">

            <div style="font-family:'Montserrat',sans-serif; font-weight:800; color:var(--teal); background:var(--teal-light); padding:8px 18px; border-radius:999px;">

      }

      // 6. "FINAL CONVERSATION" SLIDE
      if (slide.type === "final_conversation") {
        const cardsHtml = slide.prompts
          .map(p => `
            <div class="vocab-card" style="border-top:6px solid var(--teal);">

                <div style="background:var(--off-white); padding:12px 16px; border-radius:12px; border:1px solid rgba(11,42,91,0.08);">

                  <div class="thai" style="font-size:1.55rem;">${p.thaiHint}</div>

        return `
          <div class="slide-header">
            <div class="slide-eyebrow">${slide.eyebrow}</div>

            <div class="note-banner-text">👩‍🏫 <strong>Teacher Feedback Time:</strong> Listen to the student's full conversation, then share praise and 1–2 helpful pronunciation tips!</div>

      // 7. "I CAN..." CHECKLIST SLIDE (10 items the student can click to tick)
      if (slide.type === "ican_checklist") {
        const itemsHtml = slide.items
          .map((item, idx) => {
            const isChecked = iCanChecked.has(idx);
            return `
              <div class="check-item ${isChecked ? "checked" : ""}" data-ican-idx="${idx}" tabindex="0" role="button" aria-pressed="${isChecked}">
                <div style="display:flex; align-items:center; gap:14px;">
                  <div class="check-box-circle">✓</div>
                  <div>
                    <div style="font-family:'Montserrat',sans-serif; font-weight:700; font-size:1.18rem; color:var(--navy);">I can ${item.text}</div>

            `;
          })
          .join("");

        return `
          <div class="slide-header" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;">
            <div>
              <div class="slide-eyebrow">${slide.eyebrow}</div>
              <h1 class="slide-title" style="font-size:2.15rem;">${slide.title}</h1>
              <p class="slide-subtitle">${slide.subtitle}</p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
              <button type="button" class="secondary-btn" id="tickAllICanBtn">Tick All 10</button>
              <span style="font-family:'Montserrat',sans-serif; font-weight:800; color:var(--teal); background:var(--teal-light); padding:8px 18px; border-radius:999px;">

      // 8. CONGRATULATIONS CERTIFICATE SLIDE
      if (slide.type === "certificate") {
        return `
          <div class="certificate-wrapper">
            <div class="certificate-card">
              <div class="hero-badge" style="margin-bottom:4px;">Speako · Certificate of Completion 🏆</div>
              <h1 style="font-family:'Montserrat',sans-serif; font-size:2.55rem; font-weight:800; color:var(--navy);">
                ${slide.headline}
              </h1>
              <p style="font-size:1.2rem; color:var(--muted-gray); font-weight:500;">This certificate is proudly presented to</p>
              <div class="cert-name-box" id="certNameBox" title="Click to edit student name">${customStudentName}</div>
              <p style="font-size:1.2rem; color:var(--dark-gray); max-width:780px; line-height:1.5;">
                For successfully completing all 8 live 1-on-1 lessons in practical Thai conversation, polite communication, and real-life survival Thai.
              </p>
              <div style="display:flex; align-items:center; justify-content:space-between; width:100%; max-width:780px; margin-top:14px; padding-top:16px; border-top:1.5px solid rgba(11,42,91,0.1);">
                <div style="text-align:left;">
                  <div style="font-family:'Montserrat',sans-serif; font-weight:800; color:var(--navy); font-size:1.2rem;">Speako Language Tutoring</div>
                  <div style="font-size:0.95rem; color:var(--muted-gray);">Speak with confidence, one lesson at a time.</div>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                  <span class="thai" style="font-size:2rem; color:var(--teal);">เก่งมาก! (gèng mâak! — Well done!)</span>
                  ${renderListenButton("เก่งมาก ยินดีด้วยครับ")}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 9. "WHAT'S NEXT" SLIDE
      if (slide.type === "whatsnext") {
        const cardsHtml = slide.cards
          .map(c => `
            <div class="vocab-card" style="padding:26px 28px; border-top:6px solid var(--coral);">
              <div class="vocab-card-top">
                <div class="vocab-emoji">${c.emoji}</div>
                ${renderListenButton(c.thai)}
              </div>
              <div style="margin-top:14px;">
                <h2 style="font-family:'Montserrat',sans-serif; font-size:1.45rem; color:var(--navy); margin-bottom:8px;">${c.title}</h2>
                <div class="thai" style="font-size:2rem;">${c.thai}</div>
                <div class="romanization" style="font-size:1.12rem; margin-bottom:10px;">${c.romanization}</div>
                <p class="meaning" style="font-size:1.1rem; line-height:1.5;">${c.meaning}</p>
              </div>
            </div>
          `)
          .join("");

        return `
          <div class="slide-header">
            <div class="slide-eyebrow">${slide.eyebrow}</div>
            <h1 class="slide-title">${slide.title}</h1>
            <p class="slide-subtitle">${slide.subtitle}</p>
          </div>
          <div class="vocab-grid cols-3">${cardsHtml}</div>

      // 10. HOMEWORK SLIDE
      if (slide.type === "homework") {
        const cardsHtml = slide.cards
          .map(c => `
            <div class="vocab-card" style="padding:28px 32px;">
              <div class="vocab-card-top">
                <div class="vocab-emoji">${c.emoji}</div>
                ${renderListenButton(c.speakText || c.thai)}
              </div>
              <div style="margin-top:14px;">
                <h2 style="font-family:'Montserrat',sans-serif; font-size:1.55rem; color:var(--navy); margin-bottom:8px;">${c.title}</h2>
                <div class="thai" style="font-size:2.1rem;">${c.thai}</div>
                <div class="romanization" style="font-size:1.15rem; margin-bottom:10px;">${c.romanization}</div>
                <p class="meaning" style="font-size:1.15rem; line-height:1.5;">${c.meaning}</p>
              </div>
            </div>
          `)
          .join("");

        return `
          <div class="slide-header">
            <div class="slide-eyebrow">${slide.eyebrow}</div>
            <h1 class="slide-title">${slide.title}</h1>
            <p class="slide-subtitle">${slide.subtitle}</p>
          </div>
          <div class="note-banner" style="margin-top:0; margin-bottom:18px;">
            <div class="note-banner-text">📌 <strong>Homework:</strong> ${slide.mainAssignment}</div>
          </div>
          <div class="vocab-grid cols-2">${cardsHtml}</div>
        `;
      }

      return "";
    }

    function renderCurrentSlide(withFade = true) {
      const slide = SLIDES[currentSlideIndex];
      roleplayStepCount = null;

      const updateDOM = () => {
        slideViewport.innerHTML = buildSlideHTML(slide);
        attachSlideInteractions();

        const progressPercent = ((currentSlideIndex + 1) / SLIDES.length) * 100;
        progressFill.style.width = `${progressPercent}%`;
        slideCounter.textContent = `${currentSlideIndex + 1} / ${SLIDES.length}`;

        prevBtn.disabled = currentSlideIndex === 0;
        nextBtn.disabled = currentSlideIndex === SLIDES.length - 1;

        teacherNotesBody.textContent = slide.notes || "No speaker notes for this slide.";
      };

      if (withFade) {
        slideViewport.classList.add("fading");
        setTimeout(() => {
          updateDOM();
          slideViewport.classList.remove("fading");
        }, 160);
      } else {
        updateDOM();
      }
    }

    function attachSlideInteractions() {
      // Listen buttons
      slideViewport.querySelectorAll(".listen-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const phrase = btn.getAttribute("data-speak");
          if (phrase) speakThai(phrase, btn);
        });
      });

      // Reveal cards
      slideViewport.querySelectorAll(".reveal-card").forEach(card => {
        card.addEventListener("click", () => {
          card.classList.toggle("revealed");
        });
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            e.stopPropagation();
            card.classList.toggle("revealed");
          }
        });
      });

      const revealAllBtn = document.getElementById("revealAllBtn");
      const hideAllBtn = document.getElementById("hideAllBtn");
      if (revealAllBtn) {
        revealAllBtn.addEventListener("click", () => {
          slideViewport.querySelectorAll(".reveal-card").forEach(c => c.classList.add("revealed"));
        });
      }
      if (hideAllBtn) {
        hideAllBtn.addEventListener("click", () => {
          slideViewport.querySelectorAll(".reveal-card").forEach(c => c.classList.remove("revealed"));
        });
      }

      // Quick-fire random flashcard interactions
      const quickfireCard = document.getElementById("quickfireCard");
      const nextQuickfireBtn = document.getElementById("nextQuickfireBtn");
      const toggleQuickfireRevealBtn = document.getElementById("toggleQuickfireRevealBtn");

      if (quickfireCard) {
        quickfireCard.addEventListener("click", () => {
          quickfireRevealed = !quickfireRevealed;
          renderCurrentSlide(false);
        });
      }
      if (toggleQuickfireRevealBtn) {
        toggleQuickfireRevealBtn.addEventListener("click", () => {
          quickfireRevealed = !quickfireRevealed;
          renderCurrentSlide(false);
        });
      }
      if (nextQuickfireBtn) {
        nextQuickfireBtn.addEventListener("click", () => {
          let nextIdx = Math.floor(Math.random() * QUICKFIRE_POOL.length);
          if (nextIdx === quickfireIndex && QUICKFIRE_POOL.length > 1) {
            nextIdx = (nextIdx + 1) % QUICKFIRE_POOL.length;
          }
          quickfireIndex = nextIdx;
          quickfireRevealed = false;
          quickfireCount += 1;
          renderCurrentSlide(false);
        });
      }

      // Role-play line-by-line stepping
      const stepRoleplayBtn = document.getElementById("stepRoleplayBtn");
      const showAllRoleplayBtn = document.getElementById("showAllRoleplayBtn");
      if (stepRoleplayBtn) {
        stepRoleplayBtn.addEventListener("click", () => {
          const lines = slideViewport.querySelectorAll(".dialogue-line");
          if (roleplayStepCount === null || roleplayStepCount >= lines.length) {
            roleplayStepCount = 1;
          } else {
            roleplayStepCount += 1;
          }
          lines.forEach((lineEl, idx) => {
            lineEl.classList.toggle("hidden-step", idx >= roleplayStepCount);
          });
          stepRoleplayBtn.textContent =
            roleplayStepCount < lines.length
              ? `Next Line (${roleplayStepCount}/${lines.length})`
              : "Restart Step-by-Step";
        });
      }
      if (showAllRoleplayBtn) {
        showAllRoleplayBtn.addEventListener("click", () => {
          roleplayStepCount = null;
          slideViewport.querySelectorAll(".dialogue-line").forEach(lineEl => {
            lineEl.classList.remove("hidden-step");
          });
          if (stepRoleplayBtn) stepRoleplayBtn.textContent = "Step Line-by-Line";
        });
      }

      // "Your turn" 5-step checklist
      slideViewport.querySelectorAll("[data-yourturn-idx]").forEach(el => {
        el.addEventListener("click", () => {
          const idx = Number(el.getAttribute("data-yourturn-idx"));
          if (yourTurnChecked.has(idx)) yourTurnChecked.delete(idx);
          else yourTurnChecked.add(idx);
          renderCurrentSlide(false);
        });
      });

      // "I can..." 10-item checklist
      slideViewport.querySelectorAll("[data-ican-idx]").forEach(el => {
        el.addEventListener("click", () => {
          const idx = Number(el.getAttribute("data-ican-idx"));
          if (iCanChecked.has(idx)) iCanChecked.delete(idx);
          else iCanChecked.add(idx);
          renderCurrentSlide(false);
        });
      });

      const tickAllICanBtn = document.getElementById("tickAllICanBtn");
      if (tickAllICanBtn) {
        tickAllICanBtn.addEventListener("click", () => {
          const slide = SLIDES[currentSlideIndex];
          if (iCanChecked.size === slide.items.length) {
            iCanChecked.clear();
          } else {
            slide.items.forEach((_, idx) => iCanChecked.add(idx));
          }
          renderCurrentSlide(false);
        });
      }

      // Certificate student name inline edit convenience
      const certNameBox = document.getElementById("certNameBox");
      if (certNameBox) {
        certNameBox.addEventListener("click", () => {
          const updated = window.prompt("Enter the student's name for the certificate:", customStudentName);
          if (updated && updated.trim()) {
            customStudentName = updated.trim();
            renderCurrentSlide(false);
          }
        });
      }
    }

    /* ==========================================================================
       4. NAVIGATION, KEYBOARD SHORTCUTS, TOUCH SWIPE & 16:9 SCALING
       ========================================================================== */
    function goToSlide(index) {
      if (index < 0 || index >= SLIDES.length || index === currentSlideIndex) return;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      currentSlideIndex = index;
      renderCurrentSlide(true);
    }

    function nextSlide() {
      goToSlide(currentSlideIndex + 1);
    }

    function prevSlide() {
      goToSlide(currentSlideIndex - 1);
    }

    function toggleRomanization() {
      romanizationVisible = !romanizationVisible;
      document.body.classList.toggle("hide-romanization", !romanizationVisible);
      document.getElementById("romStateText").textContent = romanizationVisible ? "ON" : "OFF";
      document.getElementById("toggleRomBtn").classList.toggle("active", !romanizationVisible);
    }

    function toggleTeacherNotes() {
      notesVisible = !notesVisible;
      document.body.classList.toggle("show-notes", notesVisible);
      document.getElementById("toggleNotesBtn").classList.toggle("active", notesVisible);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    prevBtn.addEventListener("click", prevSlide);
    nextBtn.addEventListener("click", nextSlide);
    document.getElementById("toggleRomBtn").addEventListener("click", toggleRomanization);
    document.getElementById("toggleNotesBtn").addEventListener("click", toggleTeacherNotes);
    document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);

    window.addEventListener("keydown", e => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;

      const key = e.key;
      if (key === "ArrowRight" || key === "PageDown") {
        e.preventDefault();
        nextSlide();
      } else if (key === "ArrowLeft" || key === "PageUp") {
        e.preventDefault();
        prevSlide();
      } else if (key === " ") {
        if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
        e.preventDefault();
        nextSlide();
      } else if (key === "t" || key === "T") {
        e.preventDefault();
        toggleRomanization();
      } else if (key === "n" || key === "N") {
        e.preventDefault();
        toggleTeacherNotes();
      } else if (key === "f" || key === "F") {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener("touchstart", e => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }, { passive: true });

    window.addEventListener("touchend", e => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) nextSlide();
          else prevSlide();
        }
      }
    }, { passive: true });

    function updateStageScale() {
      const stageWidth = 1600;
      const stageHeight = 900;
      const scaleX = window.innerWidth / stageWidth;
      const scaleY = window.innerHeight / stageHeight;
      const scale = Math.min(scaleX, scaleY);
      document.documentElement.style.setProperty("--stage-scale", scale.toFixed(4));
    }

    window.addEventListener("resize", updateStageScale);
    updateStageScale();
    renderCurrentSlide(false);
  </script>
</body>
</html>
